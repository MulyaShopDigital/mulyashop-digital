<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akun · Mulyashop Digital</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap" id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/common.js"></script><script>mount();
(async()=>{const s=await session();if(!s)return location.replace('login.html?redirect=account.html');
const{data:o}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});
$('#app').innerHTML='<h2>Akun Saya</h2><p>'+esc(s.user.email)+'</p><button class="btn o" id=lo>Keluar</button><h3>Pesanan</h3>'+((o||[]).length?o.map(x=>`<div class=box><div class=row><b>${esc(x.order_number)}</b><span class='badge ${esc(x.status)}'>${esc(x.status)}</span></div>${x.order_items.map(i=>`<div class=row><span>${esc(i.product_name)}</span>${['paid','completed'].includes(x.status)?`<button class=btn data-o='${x.id}' data-p='${i.product_id}'>Unduh</button>`:''}</div>`).join('')}<b>${rp(x.total_amount)}</b></div>`).join(''):'<div class=empty>Belum ada pesanan.</div>');
$('#lo').onclick=async()=>{await sb.auth.signOut();location='index.html'};
document.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{try{const r=await fnCall('get-download',{order_id:b.dataset.o,product_id:b.dataset.p});location.href=r.url}catch(e){toast(e.message)}})})();</script></body></html>
