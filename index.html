<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · Mulyashop Digital</title>
<link rel="stylesheet" href="css/style.css">
<style>
.hero-banner{display:block;width:100%;max-width:880px;margin:8px auto 24px;padding:0;line-height:0}
.hero-banner img{display:block;width:100%;height:auto;max-height:380px;object-fit:contain;border-radius:24px;border:1px solid rgba(255,255,255,.75);box-shadow:0 14px 32px rgba(138,90,94,.22),0 2px 6px rgba(138,90,94,.12);background:#fffaf3}
@media (max-width:600px){
.hero-banner{margin:4px auto 18px}
.hero-banner img{border-radius:18px;max-height:none;box-shadow:0 10px 22px rgba(138,90,94,.2)}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
mount();
(async()=>{
const[{data:c},{data:p}]=await Promise.all([
sb.from('categories').select('*').eq('is_active',true).order('sort_order'),
sb.from('products').select('*,categories(name)').eq('is_active',true).order('created_at',{ascending:false}).limit(8)
]);
$('#app').innerHTML=`<div class="hero-banner"><img src="hero-banner.png" alt="Mulyashop Digital - Small tools for your everyday life" loading="eager" decoding="async"></div>
<div class=hero><h1>Mulyashop Digital</h1><p><b>Digital Store for Students</b></p><p>Planner, template, wallpaper, dan produk digital manis untuk menunjang harimu sebagai mahasiswa & pelajar.</p><a class=btn href=products.html>Mulai Belanja</a></div>
<section id=tentang><h2>Tentang Kami</h2><p>Mulyashop Digital adalah toko produk digital untuk mahasiswa dan pelajar. Produk dikirim instan lewat akun kamu setelah pembayaran berhasil.</p></section>
<section id=kategori><h2>Kategori</h2><div class='grid'>${(c||[]).map(x=>`<a class=pill href='products.html?cat=${encodeURIComponent(x.slug)}'>${esc(x.name)}</a>`).join('')}</div></section>
<section><h2>Produk</h2><div class=grid>${p&&p.length?p.map(card).join(''):EMPTY}</div>${p&&p.length?'<p style="text-align:center"><a class="btn o" href=products.html>Lihat Semua Produk</a></p>':''}</section>
<section><h2>Kenapa Mulyashop?</h2><div class='grid g3'><div class=pill>⚡ Akses instan</div><div class=pill>💳 Pembayaran manual DANA</div><div class=pill>🎓 Untuk mahasiswa</div></div></section>
<section id=faq><h2>FAQ</h2><details><summary>Bagaimana cara mendapat produk?</summary>Setelah pembayaran berhasil, buka menu Akun lalu unduh produkmu.</details><details><summary>Perlu login untuk belanja?</summary>Cukup login saat akan membayar.</details><details><summary>Metode pembayaran?</summary>Pembayaran dilakukan secara manual melalui DANA dan akan diverifikasi oleh admin.</details></section>`
})();
</script>
</body>
</html>
